# Host Nginx reverse proxy for the single-VPS deployment
# (docs/deployment/DEPLOYMENT_SPEC.md: reverse proxy/domain, no Vercel).
#
# Nginx runs directly on the Ubuntu VPS (not in Docker) and is the ONLY
# public-facing process; the frontend and backend containers publish to
# 127.0.0.1 only (docker-compose.prod.yml). Path-based routing under one
# domain keeps frontend -> backend calls same-origin, so the browser never
# needs CORS for its own requests to /api/v1/*.
#
# Replace every occurrence of your-domain.com below with the real domain
# pointed at this VPS, then install with the exact commands given at the
# bottom of this file.

upstream ai_customer_support_backend {
    server 127.0.0.1:8000;
}

upstream ai_customer_support_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # docs/rag/KNOWLEDGE_BASE_SPEC.md upload limit is 2MB
    # (backend/app/services/knowledge/service.py MAX_UPLOAD_BYTES); a little
    # headroom avoids Nginx rejecting a request the backend would accept.
    client_max_body_size 5m;

    # FastAPI backend: docs/api/API_SPEC.md base path `/api/v1`, exposed here
    # as `/api/` so both the health check and every route pass through
    # unchanged (matched prefix == proxied prefix, no path rewriting).
    location /api/ {
        proxy_pass http://ai_customer_support_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # RAG retrieval + Groq generation can run longer than Nginx's 60s
        # default before the backend's first response byte.
        proxy_connect_timeout 75s;
        proxy_read_timeout 120s;
    }

    # Next.js standalone server (everything not under /api/).
    location / {
        proxy_pass http://ai_customer_support_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- Installation on the VPS ---
#
#   sudo apt update && sudo apt install -y nginx
#   sudo cp deploy/nginx/ai-customer-support.conf /etc/nginx/sites-available/ai-customer-support.conf
#   sudo sed -i 's/your-domain.com/REPLACE_WITH_REAL_DOMAIN/' /etc/nginx/sites-available/ai-customer-support.conf
#   sudo ln -s /etc/nginx/sites-available/ai-customer-support.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Then obtain and auto-install a TLS certificate (rewrites this file on the
# VPS to add the HTTPS server block and an HTTP->HTTPS redirect; the copy in
# this repo intentionally stays HTTP-only as the template):
#
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d REPLACE_WITH_REAL_DOMAIN
